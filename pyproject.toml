[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "strava-tracklist"
version = "0.1.0"
description = "Adds the Spotify tracklist and playlist link to new Strava activities"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-only" }
dependencies = [
    "fastapi==0.121.2",
    "uvicorn==0.38.0",
    "httpx==0.28.1",
]

[project.scripts]
strava-tracklist = "strava_tracklist.app:main"
strava-tracklist-cli = "strava_tracklist.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/strava_tracklist"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
